[project]
name = "stov-scientist"
version = "0.1.0"
description = "STOV AI Scientist — scientific control plane for Space-Time Optical Vortex research (LangGraph + Deep Agents + DeepSeek)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "STOV AI Scientist Contributors" }]
dependencies = [
    # Agent / LLM runtime
    "langchain>=0.3",
    "langgraph>=0.3",
    "deepagents>=0.1",
    "langchain-deepseek>=0.1.2",
    "langsmith>=0.2",
    # Scientific contracts
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Deterministic scientific compute
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "pint>=0.23",
    # Data / storage
    "pandas>=2.1",
    "xarray>=2024.1",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "sqlalchemy>=2.0",
    # Networking / robustness
    "httpx>=0.27",
    "tenacity>=8.2",
    "orjson>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.9",
    "langchain-cli>=0.0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stov_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: integration tests that require DEEPSEEK_API_KEY and call real LLM APIs (skipped when key missing)",
    "network: tests that require public network access (literature clients)",
]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["stov_scientist"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "pint", "pint.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["stov_scientist"]
